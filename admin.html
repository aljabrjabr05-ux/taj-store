<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TAJ Trade - لوحة الإدارة</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:#08111f;
  color:#fff;
  min-height:100vh;
}

header{
  background:#111a2b;
  border-bottom:1px solid #26334a;
  padding:16px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  color:#19d38a;
  font-size:24px;
  font-weight:bold;
}

.admin-badge{
  background:#18263b;
  color:#19d38a;
  padding:10px 16px;
  border-radius:20px;
  font-weight:bold;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

h1{
  margin-bottom:6px;
}

.subtitle{
  color:#9aa9bd;
  margin-bottom:20px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:#111a2b;
  border:1px solid #26334a;
  border-radius:16px;
  padding:20px;
}

.stat-title{
  color:#9aa9bd;
  font-size:14px;
  margin-bottom:10px;
}

.stat-value{
  font-size:27px;
  font-weight:bold;
}

.green{color:#19d38a}
.red{color:#ff5577}
.yellow{color:#f5c451}
.gray{color:#aeb9ca}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.card{
  background:#111a2b;
  border:1px solid #26334a;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}

.card h2{
  font-size:19px;
  margin-bottom:18px;
}

.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:20px;
}

.tab{
  border:1px solid #26334a;
  background:#111a2b;
  color:#fff;
  padding:11px 17px;
  border-radius:10px;
  cursor:pointer;
  white-space:nowrap;
}

.tab.active{
  background:#19d38a;
  color:#061018;
  border-color:#19d38a;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:13px 8px;
  border-bottom:1px solid #26334a;
  text-align:right;
}

  color:#9aa9bd;
